<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Training</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top, #163a63 0%, #07111f 55%);
        color: #eef4ff;
      }

      .card {
        width: min(640px, 92vw);
        padding: 40px 36px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: rgba(9, 18, 32, 0.82);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 12px;
      }

      .status {
        color: #7ee0a3;
        font-size: 1.15rem;
        font-weight: 600;
        margin-bottom: 24px;
      }

      p {
        color: #c9d7ee;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>DevOps Training</h1>
      <p class="status">Application deployed successfully!</p>
      <p>Server: AWS EC2</p>
      <p>Web Server: NGINX</p>
    </main>
  </body>
</html>
